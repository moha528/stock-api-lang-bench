[package]
name = "stock-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# HTTP : axum sur hyper 1, sans les features par défaut (tracing, matched-path, form...) inutiles ici.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
# Runtime : current_thread uniquement (voir main.rs), pas besoin de rt-multi-thread.
tokio = { version = "1.54.0", features = ["rt", "net", "macros", "signal", "sync"] }
tokio-postgres = "0.7.18"
deadpool-postgres = "0.14.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
mimalloc = "0.1.52"
# Traitements lourds /cpu/* (heavy.rs).
# sha2 0.11 : backend SHA-NI choisi à l'exécution via cpufeatures, repli logiciel sinon.
sha2 = { version = "0.11.1", default-features = false }
# Pool de workers CPU dédié, séparé du runtime tokio.
rayon = "1.12.0"
foldhash = "0.2.0"
itoa = "1.0.18"
ryu = "1.0.23"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true
