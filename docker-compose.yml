# Postgres commun + les 4 implémentations, chacune bridée comme une machine légère (APP_CPUS vCPU, 1.0 par défaut, et 512 Mo).
# Lancer une app : docker compose up -d --build node   (ou rust / go / java)

x-app: &app
  environment:
    PORT: "8080"
    DATABASE_URL: postgres://stock:stock@db:5432/stock
    DB_POOL_MAX: "20"
  cpus: ${APP_CPUS:-1.0}
  mem_limit: 512m
  memswap_limit: 512m
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB
      -c synchronous_commit=off -c max_wal_size=2GB
    cpus: 3.0
    mem_limit: 2g
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/reset.sql:/reset.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 2s
      timeout: 3s
      retries: 30

  node:
    <<: *app
    build: ./node
    ports: ["8081:8080"]
    profiles: ["node"]

  rust:
    <<: *app
    build: ./rust
    ports: ["8082:8080"]
    profiles: ["rust"]

  go:
    <<: *app
    build: ./go
    ports: ["8083:8080"]
    profiles: ["go"]

  java:
    <<: *app
    build: ./java
    ports: ["8084:8080"]
    profiles: ["java"]

  k6:
    image: grafana/k6:latest
    volumes:
      - ./bench:/bench
    working_dir: /bench
    profiles: ["bench"]
